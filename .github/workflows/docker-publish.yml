name: Publish Backend Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/qwerty-polo/vertolitproject-backend

jobs:
  build-and-push:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Production
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy through AWS SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Vertolit production ${{ github.sha }}" \
            --parameters 'commands=[
              "sudo -u ubuntu -H bash -lc '"'"'set -e; cd /home/ubuntu/VertolitProject; git fetch origin main; git checkout main; git pull --ff-only origin main; docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml pull migrate backend celery-worker celery-beat; docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml run --rm migrate; docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --force-recreate backend celery-worker celery-beat; docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --build --no-deps frontend; sleep 10; curl -fsS --retry 10 --retry-delay 3 https://vertolit.pp.ua/api/v1/health/'"'"'"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Status: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}"
                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment timed out"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'