map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_for $forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
}


server {
    listen 80;
    server_name _;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS.
    # Nginx буде перевіряти адресу backend повторно,
    # а не зберігати IP контейнера назавжди.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend_upstream backend:8000;


    location = /admin {
        try_files /admin.html =404;
    }


    location = /booking {
        try_files /booking.html =404;
    }


    location /api/ {
        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }


    location / {
        try_files $uri $uri/ =404;
    }
}